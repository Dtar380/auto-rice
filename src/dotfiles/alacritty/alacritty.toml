[general]
import = [
    "~/.local/share/rice/current_theme/alacritty.toml"
]

[window]
padding = { x = 5, y = 5}
opacity = 0.85

[scrolling]
history = 5000
multiplier = 3

[font]
normal = { family = "JetBrainsMono Nerd", style = "Medium" }
builtin_box_drawing = true
size = 12

[cursor]
style = { shape = "Beam", blinking = "Always" }
thickness = 0.25

[terminal]
shell = "/usr/bin/zsh"

[keyboard]
bindings = []
